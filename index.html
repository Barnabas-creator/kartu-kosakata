<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #16211d;
    --paper: #f2efe6;
    --paper-2: #e6e1d3;
    --moss: #2f5d4f;
    --clove: #b4552d;
    --gold: #c9a227;
    --mute: #7b7768;
  }

  .app {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 20px;
    min-height: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .masthead h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 30px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .masthead h1 span { color: var(--clove); }
  .masthead .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mute);
  }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 7px 12px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { background: var(--paper-2); }
  .chip.on { background: var(--moss); border-color: var(--moss); color: #fff; }
  .chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .meter {
    display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--mute); margin-bottom: 14px;
  }
  .bar { flex: 1; height: 4px; background: var(--paper-2); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--clove); transition: width .3s; }

  /* card */
  .stage { perspective: 1400px; margin-bottom: 16px; }
  .card {
    position: relative;
    width: 100%;
    min-height: 340px;
    display: grid;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.2,.8,.25,1);
    cursor: pointer;
  }
  .card.flip { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: #fffdf7;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 26px 24px;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .face.back { transform: rotateY(180deg); }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--moss); margin-bottom: auto;
  }
  .word {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: clamp(38px, 9vw, 58px); line-height: 1.05;
    letter-spacing: -0.02em; text-align: center; margin: 14px 0 8px;
  }
  .pron {
    text-align: center; font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--clove); margin-bottom: auto;
  }
  .hint {
    text-align: center; font-size: 11px; color: var(--mute);
    font-family: 'JetBrains Mono', monospace; letter-spacing: .08em;
  }

  .back .zh {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 27px;
    margin-bottom: 14px; line-height: 1.3;
  }
  .row { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--paper-2); font-size: 14px; line-height: 1.55; }
  .row b {
    flex: 0 0 52px; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--moss); font-weight: 500; padding-top: 3px;
  }
  .row i { font-style: normal; }
  .ex { margin-top: 12px; padding: 12px; background: var(--paper); border-left: 3px solid var(--gold); font-size: 14px; line-height: 1.6; }
  .ex em { font-style: italic; color: var(--moss); display: block; margin-bottom: 3px; }
  .der-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 480px) { .der-grid { grid-template-columns: 1fr; } }
  .der { padding: 9px 0; border-top: 1px solid var(--paper-2); font-size: 14px; line-height: 1.5; }
  .der .dw { display: block; font-weight: 600; color: var(--ink); word-break: break-word; }
  .der .dz { display: block; color: var(--ink); }
  .der .dx { display: block; margin-top: 2px; font-size: 12.5px; color: var(--moss); }

  .nav { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 13px 10px; border: 1.5px solid var(--ink);
    border-radius: 4px; background: #fffdf7; color: var(--ink);
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
    cursor: pointer; transition: all .12s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 3px 0 var(--ink); }
  .btn:active { transform: none; box-shadow: none; }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn.know { background: var(--moss); border-color: var(--moss); color: #fff; }
  .btn.again { background: var(--clove); border-color: var(--clove); color: #fff; }
  .btn.ghost { flex: 0 0 auto; padding: 13px 16px; }

  .foot {
    margin-top: 16px; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: .08em; color: var(--mute); text-align: center;
  }

  .reset-btn {
    display: block; margin: 10px auto 0; padding: 6px 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase;
    background: transparent; border: 1px solid var(--mute); color: var(--mute);
    border-radius: 999px; cursor: pointer; transition: all .15s;
  }
  .reset-btn:hover { border-color: var(--clove); color: var(--clove); }
  .reset-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .tools-row { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .tools-row .reset-btn { margin: 0; }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(22,33,29,.55);
    align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 4px;
    box-shadow: 5px 5px 0 var(--ink); width: 100%; max-width: 480px;
    max-height: 80vh; display: flex; flex-direction: column;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1.5px solid var(--ink);
  }
  .modal-head h2 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }
  .modal-close {
    background: none; border: none; font-size: 22px; line-height: 1; cursor: pointer;
    color: var(--ink); padding: 2px 6px;
  }
  .modal-close:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .modal-body { padding: 10px 18px; overflow-y: auto; }
  .empty-hint { font-size: 13px; color: var(--mute); padding: 16px 0; text-align: center; }
  .known-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-top: 1px solid var(--paper-2);
  }
  .known-item:first-child { border-top: none; }
  .known-item .kw { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; }
  .known-item .kz { font-size: 13px; color: var(--mute); margin-left: 8px; }
  .known-item button {
    flex: 0 0 auto; font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px;
    border: 1.5px solid var(--clove); border-radius: 999px; background: transparent;
    color: var(--clove); cursor: pointer;
  }
  .known-item button:hover { background: var(--clove); color: #fff; }

  .sync-hint { font-size: 13px; color: var(--mute); line-height: 1.6; margin-bottom: 14px; }
  .sync-input {
    width: 100%; padding: 11px 12px; font-family: 'JetBrains Mono', monospace;
    font-size: 14px; border: 1.5px solid var(--ink); border-radius: 4px;
    background: #fffdf7; color: var(--ink); margin-bottom: 12px;
  }
  .sync-input:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
  .sync-actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .sync-state { font-size: 12px; color: var(--mute); text-align: center; min-height: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .btn:hover { transform: none; }
  }
</style>

<div class="app">
  <div class="masthead">
    <h1>Kartu <span>Kosakata</span></h1>
    <div class="sub" id="deckname">词库 · 本对话</div>
  </div>

  <div class="controls" id="cats"></div>

  <div class="meter">

    <span id="score">已掌握 0</span>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="tag" id="tagF">—</div>
        <div class="word" id="w">—</div>
        <div class="pron" id="p">—</div>
        <div class="hint">点击卡片翻面 · 空格键</div>
      </div>
      <div class="face back">
        <div class="tag" id="tagB">—</div>
        <div class="zh" id="zh">—</div>
        <div id="detail"></div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="btn ghost" id="prev" aria-label="上一个">←</button>
    <button class="btn again" id="again">再练一次</button>
    <button class="btn know" id="know">记住了</button>
    <button class="btn ghost" id="shuffle" aria-label="打乱顺序">⇄</button>
  </div>

  <div class="foot">← → 切换 · 空格翻面 · 1 再练 · 2 记住</div>
  <div class="tools-row">
    <button class="reset-btn" id="knownlist">已掌握列表 (<span id="knownCount">0</span>)</button>
    <button class="reset-btn" id="syncBtn">同步：<span id="syncStatus">未设置</span></button>
    <button class="reset-btn" id="reset">清空进度</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>已掌握的词</h2>
      <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="knownListBody"></div>
  </div>
</div>

<div class="modal-overlay" id="syncModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>跨设备同步</h2>
      <button class="modal-close" id="syncModalClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <p class="sync-hint">在电脑和手机上都填一样的同步码，两边的学习进度就会自动同步。第一次连接会把这台设备和云端已有的进度合并到一起。</p>
      <input type="text" id="syncCodeInput" class="sync-input" placeholder="自己起一个同步码，比如生日或暗号" autocomplete="off">
      <div class="sync-actions">
        <button class="btn know" id="syncSaveBtn">保存并同步</button>
        <button class="btn ghost" id="syncDisconnectBtn">断开同步</button>
      </div>
      <p class="sync-state" id="syncState"></p>
    </div>
  </div>
</div>

function cardId(d){
  const slug = String(d.w).trim().toLowerCase().replace(/\s+/g, "-");
  return d.n ? `${d.t}:${slug}-${d.n}` : `${d.t}:${slug}`;
}
let deck = DATA.map(d=>({...d, id: cardId(d)}));
let view = deck.slice();
let idx = 0;

const STORAGE_KEY = "kosakata-known-v2";
const SYNC_CODE_KEY = "kosakata-sync-code";
function loadKnown(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch(e){ return new Set(); }
}
function saveKnown(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...known])); } catch(e){}
  pushKnownToRemote();
}
let known = loadKnown();
let cat = "全部";

let syncRef = null;
let unsubscribeSync = null;
let applyingRemote = false;

function pushKnownToRemote(){
  if(!syncRef || applyingRemote) return;
  setDoc(syncRef, { knownV2: [...known] }, { merge: true }).catch(()=>{
    setSyncState("推送失败，检查网络后会自动重试。");
  });
}

function setSyncState(msg){
  const el = document.getElementById("syncState");
  if(el) el.textContent = msg || "";
}

async function connectSync(code){
  code = code.trim();
  if(unsubscribeSync){ unsubscribeSync(); unsubscribeSync = null; }
  if(!code){ disconnectSync(); return; }
  localStorage.setItem(SYNC_CODE_KEY, code);
  syncRef = doc(db, "progress", code);
  $("syncStatus").textContent = "连接中…";
  setSyncState("正在连接并合并进度…");
  try {
    const snap = await getDoc(syncRef);
    const remoteIds = snap.exists() ? (snap.data().knownV2 || []) : [];
    remoteIds.forEach(id => known.add(id));
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...known]));
    await setDoc(syncRef, { knownV2: [...known] }, { merge: true });
    filter();
    $("knownCount").textContent = known.size;
    $("syncStatus").textContent = "已连接";
    setSyncState(`已连接，同步码：${code}`);
    unsubscribeSync = onSnapshot(syncRef, snap=>{
      if(snap.metadata.hasPendingWrites) return;
      const data = snap.data();
      if(!data) return;
      applyingRemote = true;
      known = new Set(data.knownV2 || []);
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...known]));
      applyingRemote = false;
      filter();
      if($("modalOverlay").classList.contains("show")) renderKnownList();
    }, ()=>{
      $("syncStatus").textContent = "连接失败";
      setSyncState("同步连接失败，请检查网络或稍后重试。");
    });
  } catch(e){
    $("syncStatus").textContent = "连接失败";
    setSyncState("同步连接失败，请检查网络或稍后重试。");
  }
}

function disconnectSync(){
  if(unsubscribeSync){ unsubscribeSync(); unsubscribeSync = null; }
  syncRef = null;
  localStorage.removeItem(SYNC_CODE_KEY);
  $("syncStatus").textContent = "未设置";
  setSyncState("已断开同步，进度仍保存在本设备。");
}

const $ = id => document.getElementById(id);
const card = $("card");

const CATS = ["名词","动词","形容词","虚词","高频","工作","教会","生活","辨音","其他"];

function inCat(d){ return cat === "全部" || d.c.includes(cat); }

function cats(){
  $("cats").innerHTML = ["全部", ...CATS].map(c=>{
    const n = c === "全部" ? DATA.length : DATA.filter(d=>d.c.includes(c)).length;
    return `<button class="chip ${c===cat?'on':''}" data-c="${c}">${c} ${n}</button>`;
  }).join("");
  $("cats").querySelectorAll(".chip").forEach(b=>{
    b.onclick = ()=>{ cat = b.dataset.c; filter(); cats(); };
  });
}

function filter(){
  view = deck.filter(d => inCat(d) && !known.has(d.id));
  idx = 0; render();
}

function render(){
  $("knownCount").textContent = known.size;
  $("score").textContent = `已掌握 ${known.size}`;
  if(!view.length){
    card.classList.remove("flip");
    $("tagF").textContent = cat;
    $("tagB").textContent = cat;
    const inScope = deck.some(inCat);
    $("w").textContent = inScope ? "🎉" : "—";
    $("p").textContent = "";
    $("zh").textContent = inScope ? "这个分类的词你都记住了！" : "这个组合下没有卡片。";
    $("detail").innerHTML = inScope
      ? `<div class="row"><i>点击下方"已掌握列表"可以把词移出来重新练习。</i></div>`
      : `<div class="row"><i>换一个分类，或把类型切回"全部"。</i></div>`;
    $("pos").textContent = "0 / 0";
    $("fill").style.width = "0%";
    return;
  }
  card.classList.remove("flip");
  const d = view[idx];
  $("w").textContent = d.w;
  $("p").textContent = d.p;
  const tag = d.c.slice(0, 2).join(" · ");
  $("tagF").textContent = tag;
  $("tagB").textContent = tag;
  $("zh").textContent = d.zh;
  const [ind, chn] = d.ex.split("|");
  const row = (label, val) => `<div class="row"><b>${label}</b><i>${val}</i></div>`;
  const exBlock = `<div class="ex"><em>${ind}</em>${chn}</div>`;
  $("detail").innerHTML = d.t === "phrase"
    ? row("直译", d.lit) + (d.note ? row("提示", d.note) : "") + exBlock
    : row("词性", d.pos)
      + ((d.der || []).length
          ? `<div class="der-grid">` + d.der.map(x =>
              `<div class="der"><span class="dw">${x.w}</span><span class="dz">${x.zh}</span><span class="dx">${x.ex}</span></div>`
            ).join("") + `</div>`
          : "")
      + (d.syn ? row("辨析", d.syn) : "")
      + exBlock;
  $("pos").textContent = `${idx+1} / ${view.length}`;
  $("fill").style.width = `${(idx+1)/view.length*100}%`;
}

function go(n){
  if(!view.length) return;
  idx = (idx + n + view.length) % view.length;
  render();
}

function markKnown(){
  if(!view.length) return;
  known.add(view[idx].id);
  saveKnown();
  view.splice(idx, 1);
  if(view.length) idx = idx % view.length;
  render();
}

function renderKnownList(){
  const items = [...known].map(id => deck.find(d => d.id === id)).filter(Boolean);
  $("knownListBody").innerHTML = items.length
    ? items.map(d => `<div class="known-item"><div><span class="kw">${d.w}</span><span class="kz">${d.zh}</span></div><button data-id="${d.id}">移出</button></div>`).join("")
    : `<p class="empty-hint">还没有已掌握的词。</p>`;
  $("knownListBody").querySelectorAll("button[data-id]").forEach(b=>{
    b.onclick = ()=>{
      known.delete(b.dataset.id);
      saveKnown();
      renderKnownList();
      filter();
    };
  });
}

card.onclick = ()=> card.classList.toggle("flip");
$("prev").onclick = ()=> go(-1);
$("again").onclick = ()=>{ go(1); };
$("know").onclick = ()=> markKnown();
$("shuffle").onclick = ()=>{
  for(let i=view.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [view[i],view[j]]=[view[j],view[i]]; }
  idx=0; render();
};
$("reset").onclick = ()=>{
  if(confirm("确定要清空全部学习进度吗？此操作无法撤销。")){
    known.clear();
    saveKnown();
    filter();
  }
};
$("knownlist").onclick = ()=>{ renderKnownList(); $("modalOverlay").classList.add("show"); };
$("modalClose").onclick = ()=> $("modalOverlay").classList.remove("show");
$("modalOverlay").onclick = e=>{ if(e.target.id==="modalOverlay") $("modalOverlay").classList.remove("show"); };

$("syncBtn").onclick = ()=>{
  $("syncCodeInput").value = localStorage.getItem(SYNC_CODE_KEY) || "";
  setSyncState(syncRef ? `已连接，同步码：${localStorage.getItem(SYNC_CODE_KEY)}` : "");
  $("syncModalOverlay").classList.add("show");
};
$("syncModalClose").onclick = ()=> $("syncModalOverlay").classList.remove("show");
$("syncModalOverlay").onclick = e=>{ if(e.target.id==="syncModalOverlay") $("syncModalOverlay").classList.remove("show"); };
$("syncSaveBtn").onclick = ()=> connectSync($("syncCodeInput").value);
$("syncDisconnectBtn").onclick = ()=>{ disconnectSync(); $("syncCodeInput").value = ""; };

document.addEventListener("keydown", e=>{
  if($("syncModalOverlay").classList.contains("show")){
    if(e.key==="Escape") $("syncModalOverlay").classList.remove("show");
    return;
  }
  if($("modalOverlay").classList.contains("show")){
    if(e.key==="Escape") $("modalOverlay").classList.remove("show");
    return;
  }
  if(e.key===" "){ e.preventDefault(); card.classList.toggle("flip"); }
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
  if(e.key==="1"){ go(1); }
  if(e.key==="2"){ markKnown(); }
});

cats(); filter();
const savedSyncCode = localStorage.getItem(SYNC_CODE_KEY);
if(savedSyncCode) connectSync(savedSyncCode);
</script>
