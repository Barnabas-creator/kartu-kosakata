<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

    flex-wrap: wrap;

    font-size: 30px;

  .stage { perspective: 1400px; margin-bottom: 16px; }
  .card {
    position: relative;
    width: 100%;
    min-height: 340px;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.2,.8,.25,1);
    cursor: pointer;
  }
  .card.flip { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: #fffdf7;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 26px 24px;
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .face.back { transform: rotateY(180deg); }

  .tag {

  .ex { margin-top: 12px; padding: 12px; background: var(--paper); border-left: 3px solid var(--gold); font-size: 14px; line-height: 1.6; }
  .ex em { font-style: italic; color: var(--moss); display: block; margin-bottom: 3px; }

  .nav { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 13px 10px; border: 1.5px solid var(--ink);
    border-radius: 4px; background: #fffdf7; color: var(--ink);
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;

  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 3px 0 var(--ink); }
  .btn:active { transform: none; box-shadow: none; }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn.know { background: var(--moss); border-color: var(--moss); color: #fff; }
  .btn.again { background: var(--clove); border-color: var(--clove); color: #fff; }
  .btn.ghost { flex: 0 0 auto; padding: 13px 16px; }

  .foot {
    margin-top: 16px; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: .08em; color: var(--mute); text-align: center;
  }

  .reset-btn {
    display: block; margin: 10px auto 0; padding: 6px 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase;

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .btn:hover { transform: none; }

</style>

<div class="app">
  <div class="masthead">

  </div>

    <button class="btn know" id="know">记住了</button>
    <button class="btn ghost" id="shuffle" aria-label="打乱顺序">⇄</button>
  </div>

  <div class="foot">← → 切换 · 空格翻面 · 1 再练 · 2 记住</div>
  <button class="reset-btn" id="reset">清空进度</button>
</div>

let deck = DATA.map((d,i)=>({...d,id:i}));
let view = deck.slice();
let idx = 0;

const STORAGE_KEY = "kosakata-known";
function loadKnown(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch(e){ return new Set(); }
}
function saveKnown(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...known])); } catch(e){}
}
let known = loadKnown();
let cat = "全部";

const $ = id => document.getElementById(id);
const card = $("card");

function cats(){
  const set = ["全部", ...new Set(DATA.map(d=>d.c))];
  $("cats").innerHTML = set.map(c=>
    `<button class="chip ${c===cat?'on':''}" data-c="${c}">${c} ${c==='全部'?DATA.length:DATA.filter(d=>d.c===c).length}</button>`
  ).join("");
  $("cats").querySelectorAll(".chip").forEach(b=>{
    b.onclick = ()=>{ cat=b.dataset.c; filter(); cats(); };
  });
}

function filter(){
  view = cat==="全部" ? deck.slice() : deck.filter(d=>d.c===cat);
  idx = 0; render();
}

function render(){
  if(!view.length) return;
  card.classList.remove("flip");
  const d = view[idx];
  $("w").textContent = d.w;
  $("p").textContent = d.p;
  $("tagF").textContent = d.c + (known.has(d.id) ? " · 已掌握" : "");
  $("tagB").textContent = d.c;
  $("zh").textContent = d.zh;
  const [ind, chn] = d.ex.split("|");
  $("detail").innerHTML =
    `<div class="row"><b>词根</b><i>${d.root}</i></div>` +
    `<div class="row"><b>搭配</b><i>${d.coll}</i></div>` +
    `<div class="row"><b>辨析</b><i>${d.syn}</i></div>` +
    `<div class="ex"><em>${ind}</em>${chn}</div>`;
  $("pos").textContent = `${idx+1} / ${view.length}`;
  $("fill").style.width = `${(idx+1)/view.length*100}%`;
  $("score").textContent = `已掌握 ${known.size}`;
}

function go(n){
  if(!view.length) return;
  idx = (idx + n + view.length) % view.length;
  render();
}

card.onclick = ()=> card.classList.toggle("flip");
$("prev").onclick = ()=> go(-1);
$("again").onclick = ()=>{ known.delete(view[idx].id); saveKnown(); go(1); };
$("know").onclick = ()=>{ known.add(view[idx].id); saveKnown(); go(1); };
$("shuffle").onclick = ()=>{
  for(let i=view.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [view[i],view[j]]=[view[j],view[i]]; }
  idx=0; render();
};
$("reset").onclick = ()=>{
  if(confirm("确定要清空全部学习进度吗？此操作无法撤销。")){
    known.clear();
    saveKnown();
    render();
  }
};

document.addEventListener("keydown", e=>{
  if(e.key===" "){ e.preventDefault(); card.classList.toggle("flip"); }
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
  if(e.key==="1"){ known.delete(view[idx].id); saveKnown(); go(1); }
  if(e.key==="2"){ known.add(view[idx].id); saveKnown(); go(1); }
});

cats(); render();
</script>
